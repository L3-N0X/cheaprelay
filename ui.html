<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRT Twitch Relay</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a20; --text:#ececf1; --muted:#9a9aa6; --line:#2a2a33;
          --live:#22c55e; --fb:#f59e0b; --off:#71717a; --bad:#ef4444; --accent:#9146ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:16px; display:grid; gap:12px; }
  h1 { font-size:18px; margin:4px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .state { font-size:28px; font-weight:700; letter-spacing:.04em; }
  .since { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { font:inherit; font-weight:600; padding:14px; border-radius:10px; border:1px solid var(--line);
           background:#24242c; color:var(--text); cursor:pointer; }
  button:active { transform:scale(.98); }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.danger { background:#3a1d1f; border-color:#5a2a2d; }
  button.armed { background:var(--bad); border-color:var(--bad); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; font-size:14px; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  .err { color:var(--bad); font-size:13px; word-break:break-word; }
  input { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line);
          background:#111116; color:var(--text); }
</style>
</head>
<body>
<main>
  <h1>SRT → Twitch Relay</h1>

  <div class="card">
    <div class="state" id="state">…</div>
    <div class="since" id="since"></div>
    <div class="err" id="err"></div>
  </div>

  <div class="grid">
    <button class="primary" id="start">Start stream</button>
    <button class="danger" id="stop">Stop stream</button>
    <button id="brb">Force fallback</button>
    <button id="reconnect">Reconnect</button>
  </div>

  <div class="card">
    <dl id="input"></dl>
  </div>

  <div class="card">
    <label for="token" class="since">API token (stored in this browser)</label>
    <input id="token" type="password" autocomplete="off">
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = "";
try { token = localStorage.getItem("relayToken") || ""; } catch (_) {}
$("token").value = token;
$("token").addEventListener("change", (e) => {
  token = e.target.value.trim();
  try { localStorage.setItem("relayToken", token); } catch (_) {}
  refresh();
});

let forced = false;

async function call(method, path) {
  const res = await fetch(path, { method, headers: token ? { Authorization: "Bearer " + token } : {} });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}

function render(st) {
  const o = st.output, i = st.input;
  const colors = { live: "var(--live)", fallback: "var(--fb)", stopped: "var(--off)" };
  let label = o.mode.toUpperCase();
  if (o.running && !o.ffmpeg_running) label = "RECONNECTING";
  if (o.mode === "fallback" && o.forced_fallback) label = "FALLBACK (FORCED)";
  $("state").textContent = label;
  $("state").style.color = o.running && !o.ffmpeg_running ? "var(--bad)" : colors[o.mode];
  $("since").textContent = o.mode === "stopped" ? "Not connected to Twitch" :
    "for " + ago(o.mode_since) + " · " + o.switches + " switches · " + o.restarts + " restarts";
  $("err").textContent = o.last_error ? "Last error (" + ago(o.last_error_at) + " ago): " + o.last_error : "";

  forced = o.forced_fallback;
  $("brb").textContent = forced ? "Release fallback" : "Force fallback";

  const rows = [
    ["Phone", i.connected ? (i.active ? "sending" : "connected, no data") : "not connected"],
    ["Bitrate", i.bitrate_kbps + " kbps"],
    ["Last data", i.last_data_ms_ago == null ? "never" : i.last_data_ms_ago + " ms ago"],
    ["RTT", i.connected ? i.rtt_ms.toFixed(0) + " ms" : "–"],
    ["Lost / dropped pkts", i.packets_lost + " / " + i.packets_dropped],
    ["Connected", i.connected ? ago(i.connected_at) : "–"],
  ];
  $("input").replaceChildren(...rows.flatMap(([k, v]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = v; return [dt, dd];
  }));
}

async function refresh() {
  try { render(await call("GET", "/api/status")); }
  catch (e) { $("state").textContent = "—"; $("state").style.color = "var(--bad)"; $("err").textContent = e.message; }
}

async function act(path) {
  try { render(await call("POST", path)); } catch (e) { $("err").textContent = e.message; }
}

$("start").onclick = () => act("/api/start");
$("reconnect").onclick = () => act("/api/reconnect");
$("brb").onclick = () => act(forced ? "/api/fallback/release" : "/api/fallback/force");

// Stopping ends the Twitch broadcast, so require a second tap.
let armTimer = null;
$("stop").onclick = () => {
  const b = $("stop");
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "Tap again to end stream";
    armTimer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Stop stream"; }, 3000);
    return;
  }
  clearTimeout(armTimer); b.classList.remove("armed"); b.textContent = "Stop stream";
  act("/api/stop");
};

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
